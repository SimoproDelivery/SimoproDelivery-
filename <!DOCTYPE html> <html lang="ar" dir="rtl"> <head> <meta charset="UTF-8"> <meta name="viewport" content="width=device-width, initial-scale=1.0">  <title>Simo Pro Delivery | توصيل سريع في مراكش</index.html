<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simo Pro Delivery | توصيل سريع في مراكش</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#07101f;
  color:white;
  line-height:1.7;
}

header{
  background:rgba(4,10,20,.95);
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid #12345c;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#16aaff;
}

.logo span{
  color:white;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 10px;
  font-size:15px;
}

nav a:hover{
  color:#16aaff;
}

.hero{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
  radial-gradient(circle at center,#123b67 0%,#07101f 55%,#030812 100%);
}

.hero-content{
  max-width:850px;
}

.badge{
  display:inline-block;
  border:1px solid #168ee0;
  color:#22adff;
  padding:7px 18px;
  border-radius:30px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(38px,7vw,75px);
  margin-bottom:15px;
}

.hero h1 span{
  color:#159fff;
}

.hero p{
  font-size:20px;
  color:#d6e2ef;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  padding:13px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
}

.primary{
  background:#079cf0;
  color:white;
}

.secondary{
  border:1px solid #168ee0;
  color:white;
}

section{
  padding:70px 7%;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title h2{
  font-size:35px;
}

.title p{
  color:#aebed0;
}

.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:linear-gradient(145deg,#0d2038,#081321);
  padding:30px 20px;
  border-radius:18px;
  text-align:center;
  border:1px solid #15385d;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#139ff0;
}

.icon{
  font-size:45px;
  margin-bottom:12px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:#b6c5d5;
}

.about{
  background:#050d19;
  text-align:center;
}

.about-box{
  max-width:850px;
  margin:auto;
  color:#c7d3df;
  font-size:18px;
}

.contact{
  background:linear-gradient(135deg,#0a2745,#07101f);
  text-align:center;
}

.phone{
  font-size:32px;
  font-weight:bold;
  color:#16aaff;
  margin:20px 0;
}

.form{
  max-width:600px;
  margin:30px auto 0;
  display:grid;
  gap:14px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #24496c;
  background:#071321;
  color:white;
  font-size:16px;
}

textarea{
  min-height:120px;
  resize:vertical;
}
